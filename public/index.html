<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#123e70">
  <title>SIP-BPD Desa Pegandekan</title>
  <style>
    *{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px;background:linear-gradient(135deg,#0c315b,#1b609b);font-family:Arial,sans-serif;color:#173e67}.card{width:min(460px,100%);padding:34px;background:#fff;border-radius:18px;text-align:center;box-shadow:0 20px 60px #001c3c55}.logo{width:88px;height:88px;object-fit:contain;border-radius:12px}.eyebrow{font-size:11px;letter-spacing:2px;color:#66809c;font-weight:700;margin:18px 0 5px}h1{margin:0;color:#143f6c;font-size:32px}.sub{color:#718198;line-height:1.6}.notice{margin-top:22px;padding:14px;border-radius:10px;background:#fff7e6;color:#805600;font-size:13px;line-height:1.6;text-align:left}.small{font-size:12px;color:#718198;margin-top:22px}
  </style>
</head>
<body>
  <main class="card">
    <img class="logo" src="https://i.ibb.co.com/YFrtpck8/logobpd.jpg" alt="Logo BPD Desa Pegandekan">
    <p class="eyebrow">SISTEM INFORMASI</p>
    <h1>SIP-BPD</h1>
    <p class="sub">Badan Permusyawaratan Desa Pegandekan</p>
    <div class="notice">
      <strong>Aplikasi belum diarahkan.</strong><br>
      Administrator perlu mengisi variabel <code>SIP_BPD_GAS_URL</code>
      pada pengaturan Cloudflare Worker dengan URL deployment Web App
      Google Apps Script yang berakhiran <code>/exec</code>.
    </div>
    <p class="small">SIP-BPD Desa Pegandekan · Purbalingga</p>
  </main>
</body>
</html>
